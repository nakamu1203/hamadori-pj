<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浜通りプロジェクト ウィンタースクール2026 大学生参加案内</title>
  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --school-solid: #D4387E;
      --school-surface: #FDF2F7;
      --community-solid: #008252;
      --community-surface: #F0FDF4;
      --startup-solid: #0077B6;
      --startup-surface: #F0F9FF;
      --main-green: #00A368;
      --main-green-dark: #008252;
      --cta-orange: #EA580C;
      --cta-orange-hover: #C2410C;
      --text-main: #1A1A1A;
      --text-muted: #475467;
      --border-color: #E2E8F0;
      --bg-page: #F8FAFC;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.7;
      padding: 24px 16px 80px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Card Box */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 28px 20px;
      overflow: hidden;
    }

    /* Header / Hero */
    .hero {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .univ-tag {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .logo-wrapper {
      width: 170px;
      height: 170px;
      margin-bottom: 14px;
    }
    .logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hero-badge {
      background: var(--main-green);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
      display: inline-block;
    }
    .hero-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .hero-subtitle {
      font-size: 15px;
      font-weight: 700;
      color: var(--main-green);
      margin-bottom: 16px;
    }
    .support-banner {
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      color: #92400E;
      font-size: 13.5px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      width: 100%;
      text-align: center;
      margin-bottom: 16px;
    }

    /* CTA Section (Common) */
    .cta-box {
      background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
      border: 2px solid #FDBA74;
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .cta-deadline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14.5px;
      font-weight: 900;
      color: #C2410C;
    }
    .badge-status {
      background: #EA580C;
      color: #FFFFFF;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .btn-apply {
      display: block;
      width: 100%;
      background: var(--cta-orange);
      color: #FFFFFF;
      text-decoration: none;
      font-size: 16.5px;
      font-weight: 800;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
      transition: all 0.2s;
    }
    .btn-apply:hover {
      background: var(--cta-orange-hover);
      transform: translateY(-1px);
    }
    .btn-apply:active {
      transform: scale(0.98);
    }
    .cta-subtext {
      font-size: 12px;
      color: #7C2D12;
    }

    /* Headings */
    .section-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      border-left: 5px solid var(--main-green);
      padding-left: 10px;
    }

    /* Roles / Program Overview */
    .role-intro {
      font-size: 14.5px;
      margin-bottom: 16px;
      color: #334155;
    }
    .role-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .role-item {
      background: #F8FAFC;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }
    .role-item.day1 {
      border-left: 5px solid var(--community-solid);
    }
    .role-item.day2 {
      border-left: 5px solid var(--school-solid);
    }
    .role-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .role-day {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }
    .role-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .role-tag.tag-comm {
      background: var(--community-surface);
      color: var(--community-solid);
      border: 1px solid #BBF7D0;
    }
    .role-tag.tag-school {
      background: var(--school-surface);
      color: var(--school-solid);
      border: 1px solid #FBCFE8;
    }
    .role-desc {
      font-size: 13.5px;
      color: #475467;
      line-height: 1.6;
    }

    /* Tabs Styling */
    .tab-header {
      display: flex;
      background: #F1F5F9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: #64748B;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #FFFFFF;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Pattern Cards (Tab 1) */
    .pattern-card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .pattern-card.featured {
      background: #F0FDF4;
      border-color: #86EFAC;
    }
    .pattern-card:last-child {
      margin-bottom: 0;
    }
    .pattern-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .pattern-name {
      font-size: 15.5px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pattern-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      background: #E2E8F0;
      color: #334155;
    }
    .pattern-pill.best {
      background: #16A34A;
      color: #FFFFFF;
    }
    .pattern-detail {
      font-size: 13.5px;
      color: #334155;
      line-height: 1.6;
    }
    .pattern-lodging {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 6px;
      background: #FFFFFF;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #E2E8F0;
    }

    /* Calendar Table (Tab 2) */
    .calendar-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .cal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: center;
      background: #FFFFFF;
    }
    .cal-table th, .cal-table td {
      padding: 10px 8px;
      border: 1px solid #E2E8F0;
      white-space: nowrap;
    }
    .cal-table thead th {
      background: #F1F5F9;
      font-weight: 800;
      color: var(--text-main);
    }
    .cal-table thead th.th-date {
      width: 110px;
      text-align: left;
      padding-left: 12px;
    }
    .cal-table tbody td.td-date {
      text-align: left;
      font-weight: 700;
      background: #F8FAFC;
      padding-left: 12px;
    }
    .cal-table tbody td.active-cell {
      background: #F0FDF4;
      color: #15803D;
      font-weight: 800;
    }
    .cal-table tbody td.half-cell {
      background: #EFF6FF;
      color: #1D4ED8;
      font-weight: 800;
    }
    .cal-table tbody td.none-cell {
      color: #94A3B8;
    }

    /* Schedule Timeline */
    .schedule-intro {
      font-size: 13px;
      color: #B45309;
      background: #FEF3C7;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 16px;
    }
    .day-block {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 16px;
    }
    .day-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #CBD5E1;
    }
    .day-tag {
      font-size: 12px;
      font-weight: 800;
      background: #334155;
      color: #FFFFFF;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .day-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
    }
    .time-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-item {
      display: flex;
      gap: 12px;
      font-size: 13.5px;
    }
    .time-col {
      min-width: 65px;
      font-weight: 800;
      color: var(--main-green);
    }
    .desc-col {
      color: #334155;
      flex: 1;
    }
    .desc-note {
      font-size: 12px;
      color: #64748B;
      margin-top: 2px;
    }

    /* Contact Footer */
    .footer-content {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
    .footer-content a {
      color: #D4387E;
      font-weight: 700;
    }
  </style>
</head>
